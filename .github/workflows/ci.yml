name: CI

# WP-3 CI-wiring gap closure (per 13_phase1_execution_plan.md WP-9 §122:
# "each WP wires its own suite in"). Runs GarageOS.Tests.Unit and
# GarageOS.Tests.Integration against a real PostgreSQL 15 service
# container on every push/PR against main.
#
# This is a CI-native `services:` container (DECISIONS.md #10, WP-2/WP-9):
# not Testcontainers, not Docker managed by app/test code, not an
# EF Core InMemory/SQLite substitute. Integration tests run against real
# PostgreSQL 15+ per DECISIONS.md #10.
#
# No deployment steps here. No production credentials here. Production
# deployment is a separate, Owner-approval-gated workflow/runbook.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Real, ephemeral, CI-only PostgreSQL 15 service container below — fresh
  # on every run, destroyed at job end. The password here is a throwaway
  # value for that ephemeral database, not a persisted/production
  # credential (see workflow header comment).
  ConnectionStrings__GarageOsDb: "Host=localhost;Port=5432;Database=pit961_integration_test;Username=postgres;Password=postgres"
  ConnectionStrings__PlatformDb: "Host=localhost;Port=5432;Database=pit961_integration_test;Username=postgres;Password=postgres"
  ConnectionStrings__IntegrationTestDb: "Host=localhost;Port=5432;Database=pit961_integration_test;Username=postgres;Password=postgres"

jobs:
  build-and-test:
    name: Build & test (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pit961_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WP-7 brief §5 / 13_phase1_execution_plan.md WP-9 acceptance criterion
      # (Owner-mandated, blocking, CI-wired -- not a one-off manual grep). Fails the
      # build the moment a literal "Rashid" placeholder-brand reference reappears in
      # backend/ or frontend/. See the script's own header comment for full
      # scope/rationale. The required negative-test proof was run manually against this
      # exact script before this step was wired in: a "Rashid" literal was introduced in
      # one file of each covered extension the check scans (.cs, .txt, .yaml, .svg,
      # .resx), the check was confirmed to fail and list every one of them, the files
      # were removed, and the check was confirmed to pass again cleanly. WP-7's tracking
      # entry (PROGRESS.md) records this once WP-7 clears its QA/Security gates, per
      # standing project policy of only marking a work package's tracking docs complete
      # after both gates pass.
      - name: Check for placeholder brand name ("Rashid")
        run: bash scripts/ci/check-no-legacy-brand.sh

      # WP-6 brief / 11_engineering_handoff.md §11A (Owner-mandated, blocking, CI-wired --
      # not a one-off manual grep). Fails the build the moment any file other than
      # ResendEmailService.cs references the Resend API host, proving the Resend SDK/API
      # boundary stays confined to that one class (Decision #8). See the script's own
      # header comment for full scope/rationale. The required negative-test proof was run
      # manually against this exact script before this step was wired in: a
      # "https://api.resend.com/emails" literal was introduced in a file other than
      # ResendEmailService.cs, the check was confirmed to fail and name that file, the
      # literal was removed, and the check was confirmed to pass again cleanly.
      - name: Check for Resend API references outside ResendEmailService
        run: bash scripts/ci/check-no-resend-outside-service.sh

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # dotnet-ef is pinned as a local tool in backend/.config/dotnet-tools.json
      # (isRoot: true, version 8.0.11, matching the EFCore.Design package
      # version). Migrations are NOT self-applied anywhere in the app or the
      # integration-test fixture (verified in Program.cs and
      # IntegrationTestFixture.cs) so CI must apply them explicitly below.
      - name: Restore dotnet local tools (dotnet-ef)
        working-directory: backend
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore backend/GarageOS.sln

      - name: Build
        run: dotnet build backend/GarageOS.sln --no-restore

      # Applies cleanly to a fresh Postgres instance — this is WP-3's own
      # restated acceptance criterion #1, exercised here against the
      # always-fresh CI Postgres service container. Two DbContexts, two
      # migrations-history tables (__EFMigrationsHistory vs
      # __ef_migrations_history_platform) — each must be applied separately.
      - name: Apply AppDbContext migrations
        working-directory: backend
        run: >-
          dotnet ef database update
          --context AppDbContext
          --project GarageOS.Infrastructure/GarageOS.Infrastructure.csproj
          --startup-project GarageOS.Api/GarageOS.Api.csproj

      - name: Apply PlatformDbContext migrations
        working-directory: backend
        run: >-
          dotnet ef database update
          --context PlatformDbContext
          --project GarageOS.Infrastructure/GarageOS.Infrastructure.csproj
          --startup-project GarageOS.Api/GarageOS.Api.csproj

      # Runs GarageOS.Tests.Unit (no DB needed) and GarageOS.Tests.Integration
      # (real Postgres via the service container above) together. Default
      # `dotnet test` exit-code behavior fails the workflow on any test
      # failure — nothing here swallows that exit code.
      - name: Test (GarageOS.Tests.Unit + GarageOS.Tests.Integration)
        run: dotnet test backend/GarageOS.sln --no-build


  build-and-test-frontend:
    name: Build & test (frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` runs `tsc --noEmit` first, so a type error fails the
      # build here rather than surfacing at runtime.
      - name: Build (typecheck + vite build)
        working-directory: frontend
        run: npm run build

      - name: Unit/component tests (Vitest + React Testing Library)
        working-directory: frontend
        run: npm test

  # ---------------------------------------------------------------------------
  # Playwright e2e against the REAL stack: real Vite frontend -> real ASP.NET
  # Core backend -> real PostgreSQL 15. No mocks, no faked login (WP-9 order,
  # 2026-09-02). This job owns its own Postgres service container and its own
  # migrations (separate database from build-and-test's Testing-environment
  # run) because it must run the backend in the Development environment
  # specifically -- DevelopmentSeeder
  # (backend/GarageOS.Infrastructure/Data/Seed/DevelopmentSeeder.cs) only
  # fires under app.Environment.IsDevelopment() (see Program.cs), and the
  # e2e specs (frontend/e2e/login.spec.ts) log in with that exact seeded
  # account (frontend/e2e/fixtures.ts: SEEDED_DEV_USER).
  #
  # Deterministic startup: the backend and frontend are started in the
  # background and polled for real readiness (the backend's own
  # app.MapHealthChecks("/health"); a plain HTTP probe for the Vite server)
  # rather than relying on a fixed sleep. Each wait step fails the job with a
  # clear message, and the captured backend/frontend logs are uploaded as an
  # artifact whenever the job fails, so a hang or crash is diagnosable from
  # the Actions UI without rerunning locally. Background processes are always
  # stopped in a final always()-guarded step.
  # ---------------------------------------------------------------------------
  e2e-frontend:
    name: E2E (frontend, Chromium, real stack)
    runs-on: ubuntu-latest
    needs: [build-and-test, build-and-test-frontend]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pit961_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASPNETCORE_ENVIRONMENT: Development
      # Backend/frontend addresses the e2e suite talks to -- read by
      # playwright.config.ts / e2e/fixtures.ts, never hardcoded in specs.
      VITE_API_BASE_URL: http://localhost:5289
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      ConnectionStrings__GarageOsDb: "Host=localhost;Port=5432;Database=pit961_e2e;Username=postgres;Password=postgres"
      ConnectionStrings__PlatformDb: "Host=localhost;Port=5432;Database=pit961_e2e;Username=postgres;Password=postgres"
      # Test-only JWT signing material for this ephemeral job, sourced from a
      # GitHub Actions repository secret (CI_E2E_JWT_SIGNING_KEY) -- never
      # committed in plaintext here or anywhere else (Security Reviewer WP-9
      # gate confirms this). Not a production key: production keys are
      # sourced only from environment variables / host secret storage per
      # appsettings.Development.json's own comment. Program.cs fails closed
      # at startup on a missing/short signing key, so this secret must be a
      # real CSPRNG-generated value >=32 bytes -- just not a production one,
      # and scoped to this ephemeral CI database/job only.
      Jwt__Issuer: "pit961-ci-e2e"
      Jwt__Audience: "pit961-ci-e2e"
      Jwt__SigningKey: ${{ secrets.CI_E2E_JWT_SIGNING_KEY }}
      Jwt__KeyId: "ci-e2e-1"
      # Resend is never actually invoked by the WP-8 e2e suite (no
      # email-sending flow is exercised by login.spec.ts), but
      # ResendOptions.ValidateOnStart requires a non-empty, well-formed value
      # or the app fails closed at startup (Program.cs / ResendOptions.cs).
      # This is an obviously-non-production placeholder string -- not a real
      # Resend account, not a secret, safe to commit in plaintext.
      Resend__ApiKey: "re_ci_e2e_placeholder_not_a_real_key"
      Resend__FromAddress: "ci-e2e@pit961.invalid"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dotnet local tools (dotnet-ef)
        working-directory: backend
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore backend/GarageOS.sln

      - name: Build backend
        run: dotnet build backend/GarageOS.sln --no-restore

      - name: Apply AppDbContext migrations
        working-directory: backend
        run: >-
          dotnet ef database update
          --context AppDbContext
          --project GarageOS.Infrastructure/GarageOS.Infrastructure.csproj
          --startup-project GarageOS.Api/GarageOS.Api.csproj

      - name: Apply PlatformDbContext migrations
        working-directory: backend
        run: >-
          dotnet ef database update
          --context PlatformDbContext
          --project GarageOS.Infrastructure/GarageOS.Infrastructure.csproj
          --startup-project GarageOS.Api/GarageOS.Api.csproj

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser (Chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend (Development environment, dev seed)
        working-directory: backend
        run: |
          nohup dotnet run --no-build --project GarageOS.Api/GarageOS.Api.csproj --urls http://localhost:5289 > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/backend.pid"

      - name: Wait for backend readiness
        run: |
          BACKEND_PID="$(cat "$GITHUB_WORKSPACE/backend.pid")"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5289/health > /dev/null; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "::error::Backend process exited before becoming healthy"
              echo "--- backend.log ---"
              cat "$GITHUB_WORKSPACE/backend.log" || true
              exit 1
            fi
            sleep 1
          done
          echo "::error::Backend never became healthy within 60s"
          echo "--- backend.log ---"
          cat "$GITHUB_WORKSPACE/backend.log" || true
          exit 1

      - name: Start frontend (Vite dev server)
        working-directory: frontend
        run: |
          nohup npx vite --port 5173 --strictPort > "$GITHUB_WORKSPACE/frontend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/frontend.pid"

      - name: Wait for frontend readiness
        run: |
          FRONTEND_PID="$(cat "$GITHUB_WORKSPACE/frontend.pid")"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "Frontend healthy after ${i}s"
              exit 0
            fi
            if ! kill -0 "$FRONTEND_PID" 2>/dev/null; then
              echo "::error::Frontend process exited before becoming healthy"
              echo "--- frontend.log ---"
              cat "$GITHUB_WORKSPACE/frontend.log" || true
              exit 1
            fi
            sleep 1
          done
          echo "::error::Frontend never became healthy within 60s"
          echo "--- frontend.log ---"
          cat "$GITHUB_WORKSPACE/frontend.log" || true
          exit 1

      - name: Run Playwright tests (real frontend -> real backend -> real PostgreSQL)
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload backend/frontend logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: |
            backend.log
            frontend.log
          retention-days: 7

      - name: Stop backend and frontend
        if: ${{ always() }}
        run: |
          [ -f backend.pid ] && kill "$(cat backend.pid)" 2>/dev/null || true
          [ -f frontend.pid ] && kill "$(cat frontend.pid)" 2>/dev/null || true
