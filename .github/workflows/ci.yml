name: CI

# WP-3 CI-wiring gap closure (per 13_phase1_execution_plan.md WP-9 §122:
# "each WP wires its own suite in"). Runs GarageOS.Tests.Unit and
# GarageOS.Tests.Integration against a real PostgreSQL 15 service
# container on every push/PR against main.
#
# This is a CI-native `services:` container (DECISIONS.md #10, WP-2/WP-9):
# not Testcontainers, not Docker managed by app/test code, not an
# EF Core InMemory/SQLite substitute. Integration tests run against real
# PostgreSQL 15+ per DECISIONS.md #10.
#
# No deployment steps here. No production credentials here. Production
# deployment is a separate, Owner-approval-gated workflow/runbook.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Real, ephemeral, CI-only PostgreSQL 15 service container below — fresh
  # on every run, destroyed at job end. The password here is a throwaway
  # value for that ephemeral database, not a persisted/production
  # credential (see workflow header comment).
  ConnectionStrings__GarageOsDb: "Host=localhost;Port=5432;Database=pit961_integration_test;Username=postgres;Password=postgres"
  ConnectionStrings__PlatformDb: "Host=localhost;Port=5432;Database=pit961_integration_test;Username=postgres;Password=postgres"
  ConnectionStrings__IntegrationTestDb: "Host=localhost;Port=5432;Database=pit961_integration_test;Username=postgres;Password=postgres"

jobs:
  build-and-test:
    name: Build & test (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pit961_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WP-7 brief §5 / 13_phase1_execution_plan.md WP-9 acceptance criterion
      # (Owner-mandated, blocking, CI-wired -- not a one-off manual grep). Fails the
      # build the moment a literal "Rashid" placeholder-brand reference reappears in
      # backend/ or frontend/. See the script's own header comment for full
      # scope/rationale. The required negative-test proof was run manually against this
      # exact script before this step was wired in: a "Rashid" literal was introduced in
      # one file of each covered extension the check scans (.cs, .txt, .yaml, .svg,
      # .resx), the check was confirmed to fail and list every one of them, the files
      # were removed, and the check was confirmed to pass again cleanly. WP-7's tracking
      # entry (PROGRESS.md) records this once WP-7 clears its QA/Security gates, per
      # standing project policy of only marking a work package's tracking docs complete
      # after both gates pass.
      - name: Check for placeholder brand name ("Rashid")
        run: bash scripts/ci/check-no-legacy-brand.sh

      # WP-6 brief / 11_engineering_handoff.md §11A (Owner-mandated, blocking, CI-wired --
      # not a one-off manual grep). Fails the build the moment any file other than
      # ResendEmailService.cs references the Resend API host, proving the Resend SDK/API
      # boundary stays confined to that one class (Decision #8). See the script's own
      # header comment for full scope/rationale. The required negative-test proof was run
      # manually against this exact script before this step was wired in: a
      # "https://api.resend.com/emails" literal was introduced in a file other than
      # ResendEmailService.cs, the check was confirmed to fail and name that file, the
      # literal was removed, and the check was confirmed to pass again cleanly.
      - name: Check for Resend API references outside ResendEmailService
        run: bash scripts/ci/check-no-resend-outside-service.sh

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # dotnet-ef is pinned as a local tool in backend/.config/dotnet-tools.json
      # (isRoot: true, version 8.0.11, matching the EFCore.Design package
      # version). Migrations are NOT self-applied anywhere in the app or the
      # integration-test fixture (verified in Program.cs and
      # IntegrationTestFixture.cs) so CI must apply them explicitly below.
      - name: Restore dotnet local tools (dotnet-ef)
        working-directory: backend
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore backend/GarageOS.sln

      - name: Build
        run: dotnet build backend/GarageOS.sln --no-restore

      # Applies cleanly to a fresh Postgres instance — this is WP-3's own
      # restated acceptance criterion #1, exercised here against the
      # always-fresh CI Postgres service container. Two DbContexts, two
      # migrations-history tables (__EFMigrationsHistory vs
      # __ef_migrations_history_platform) — each must be applied separately.
      - name: Apply AppDbContext migrations
        working-directory: backend
        run: >-
          dotnet ef database update
          --context AppDbContext
          --project GarageOS.Infrastructure/GarageOS.Infrastructure.csproj
          --startup-project GarageOS.Api/GarageOS.Api.csproj

      - name: Apply PlatformDbContext migrations
        working-directory: backend
        run: >-
          dotnet ef database update
          --context PlatformDbContext
          --project GarageOS.Infrastructure/GarageOS.Infrastructure.csproj
          --startup-project GarageOS.Api/GarageOS.Api.csproj

      # Runs GarageOS.Tests.Unit (no DB needed) and GarageOS.Tests.Integration
      # (real Postgres via the service container above) together. Default
      # `dotnet test` exit-code behavior fails the workflow on any test
      # failure — nothing here swallows that exit code.
      - name: Test (GarageOS.Tests.Unit + GarageOS.Tests.Integration)
        run: dotnet test backend/GarageOS.sln --no-build


  build-and-test-frontend:
    name: Build & test (frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` runs `tsc --noEmit` first, so a type error fails the
      # build here rather than surfacing at runtime.
      - name: Build (typecheck + vite build)
        working-directory: frontend
        run: npm run build

      - name: Unit/component tests (Vitest + React Testing Library)
        working-directory: frontend
        run: npm test

  # ---------------------------------------------------------------------------
  # Playwright e2e. Separate job because it needs the real API running.
  # `PLAYWRIGHT_BASE_URL` and `VITE_API_BASE_URL` are read by
  # playwright.config.ts / e2e/fixtures.ts -- neither is hardcoded in the specs.
  # ---------------------------------------------------------------------------
  e2e-frontend:
    name: E2E (frontend, Chromium)
    runs-on: ubuntu-latest
    needs: build-and-test-frontend

    env:
      # Point these at wherever the real API and the served frontend live in CI.
      VITE_API_BASE_URL: http://localhost:5289
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser (Chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # TODO (devops-engineer): start the real backend (with dev seed data) and
      # the Vite server before this step. The WP-8 e2e specs log in with the
      # seeded development account and read GET /api/config/branding live --
      # there is deliberately no mock server. WP-8's own device verification
      # confirmed this exact suite passes for real once both processes are up
      # (see PROGRESS.md / the WP-8 acceptance report) -- what's missing here
      # is only wiring the backend service + migrations + dev seed into this
      # job, which is WP-9/devops-engineer's CI-completeness work, not WP-8's.
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
